name: ci

# Quality gates on every push and pull request. Before this existed the repo
# had 83 backend tests that no automation ever ran — the first thing to catch a
# regression was a failing release build, long after the fact.
#
# Deliberately split into three jobs so a failure names its own cause:
#   fmt      — seconds, compiles nothing, fails fast on a formatting slip
#   frontend — TypeScript only
#   rust     — clippy + tests on Linux and Windows (and macOS, see the matrix)
#
# A fourth, `changes`, decides whether a pull request needs `rust` at all.
#
# Release bundling lives in release.yml / canary.yml; nothing here builds an
# installer or touches the signing keys.

# `develop` is here for the cache, not for the gate: every PR targets it and
# can only restore caches saved on its own ref, its base branch or the default
# branch. Without a run on `develop` the base cache was main's, refreshed only
# at a version cut, so each PR recompiled whatever develop had changed since.
#
# `main` is not here on purpose. It only ever moves by fast-forwarding to a
# develop commit at a version cut (RELEASING.md), so a run there would test a
# commit develop already tested and spend ~2.9 GB of the 10 GB cache budget on
# a copy of develop's caches that no pull request needs.
on:
  push:
    branches: [develop]
  pull_request:

# A new push to the same branch supersedes the previous run. `group` includes
# the workflow name so ci and release runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here publishes, comments, or writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than `stable` on purpose. `clippy -D warnings` turns every
  # lint into a build failure, so an upstream Rust release that adds a lint
  # would turn CI red with no change to this repo. Bumping this is a
  # deliberate one-line commit that carries whatever fixes the new lints want.
  RUST_VERSION: "1.95.0"
  # Full debuginfo is the most expensive part of an MSVC link (the PDBs) and
  # roughly doubles `target/`, which is what the cache uploads and restores.
  # Line tables keep file:line in a failing test's panic and backtrace, which
  # is all CI reads; `cargo test` inherits this through the test profile.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      # `cargo fmt` only parses — it never invokes build.rs, so this job needs
      # neither the sidecar placeholder below nor the Linux WebKit packages.
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  frontend:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version intentionally unpinned here — pnpm/action-setup reads
        # `packageManager` from package.json. Specifying both produces
        # ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it `require`s the built-in
          # `node:sqlite`, absent before 22.5). Keep this >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Runs after the typecheck on purpose: a type error is the cheaper, more
      # legible failure, and vitest would report it as a transform error.
      - name: Tests
        run: pnpm test

  # Most pull requests touch only the frontend or the docs, and each of them
  # still spent 5-20 minutes compiling and testing a backend it did not change.
  # This job lists what a pull request changed and lets `rust` run only when
  # something it reads is among them.
  #
  # The list says what CANNOT reach the Rust build, not what can, so anything
  # unknown runs it: a new top-level file, a new directory, a new `include_str!`
  # into a path not named here. The Rust inputs outside src-tauri/ are named
  # first so the broader patterns below can't swallow them — today that is
  # docs/MCP*.md (`include_str!` in commands/connection.rs) and mcpb/ (read by
  # a test in mcp/mod.rs). If one is missed, the push to develop that the merge
  # produces always runs everything, so the miss surfaces one merge late
  # rather than never.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Depth 2 is the pull request's merge commit plus its first parent, the
      # base branch tip it was merged onto, which is exactly the diff to read.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Decide whether the Rust job runs
        id: filter
        shell: bash
        run: |
          # Pushes always run it: they are the post-merge safety net described
          # above, and the only runs that save the Rust cache.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A diff that cannot be read runs everything rather than nothing.
          if ! files="$(git diff --name-only HEAD^1 HEAD)" || [ -z "$files" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rust=false
          while IFS= read -r f; do
            case "$f" in
              src-tauri/*|mcpb/*|docs/MCP.md|docs/MCP.es.md|.github/*)
                rust=true ;;
              src/*|public/*|docs/*|engineering/*|brand/*|scripts/*|.claude/*) ;;
              index.html|package.json|pnpm-lock.yaml|pnpm-workspace.yaml) ;;
              tsconfig.json|tsconfig.node.json|vite.config.ts|vitest.config.ts) ;;
              tailwind.config.js|postcss.config.js) ;;
              *.md) ;;
              *)
                rust=true ;;
            esac
            [ "$rust" = true ] && echo "Rust input changed: $f" && break
          done <<< "$files"

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          [ "$rust" = false ] && echo "No Rust input changed; the Rust job is skipped."
          exit 0

  rust:
    name: clippy + tests (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      # Report both platforms' failures in one run instead of masking the
      # second behind the first.
      fail-fast: false
      # macOS is checked after merge, not before: every push to develop runs
      # it, and a pull request runs it only when it carries the `ci:macos`
      # label, for changes to macOS-specific code. Keeping it off the default
      # gate is what keeps the wait for a merge where it was. The label is read
      # from the event that started the run, so it takes effect from the next
      # push (or on opening the pull request with it), not on a re-run.
      matrix:
        platform: >-
          ${{ fromJSON(
            (github.event_name == 'push' ||
             contains(github.event.pull_request.labels.*.name, 'ci:macos'))
            && '["ubuntu-22.04", "windows-2022", "macos-15"]'
            || '["ubuntu-22.04", "windows-2022"]'
          ) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # No Dev Drive on the Windows leg, though one was tried (#306) to move
      # cargo's IO off NTFS and Defender. Mounted at src-tauri/target, the
      # volume root brings a `System Volume Information` directory nobody can
      # read, and rust-cache walks target/ before restoring: it failed with
      # EPERM on every Windows run, so that leg neither restored nor saved a
      # cache and every run built cold. Measured cold against cold, the drive
      # saved nothing (12.1 vs 12.4 minutes), so it went rather than being
      # mounted elsewhere.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # Keyed per platform so the matrix legs don't evict each other.
          key: ${{ matrix.platform }}
          # Only pushes to develop save. A PR's cache is readable by that PR
          # alone, and at ~1.5 GB a leg a handful of them pushed the repo past
          # its 10 GB budget, evicting the base caches every PR restores.
          save-if: ${{ github.event_name == 'push' }}

      - uses: ./.github/actions/linux-deps

      # CI bundles no installer, so an empty placeholder is all `cargo clippy`
      # and `cargo test` need; see the action for why one must exist at all.
      - uses: ./.github/actions/sidecar
        with:
          mode: placeholder

      # `--features mcp` is not optional here: the connector's write-policy
      # enforcement and its tests live behind that feature, and it is exactly
      # the code an unreviewed change is most dangerous in.
      - name: Clippy
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --features mcp --locked -- -D warnings

      - name: Tests
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --workspace --features mcp --locked

      # When a pull request changes Cargo.lock its cache key no longer matches
      # develop's, and rust-cache restores develop's cache as a partial match.
      # On a partial match it first deletes every artifact in target/ whose
      # mtime is more than a week old (cleanTargetDir with checkTimestamp, the
      # ONE_WEEK cutoff in its cleanup.ts), and the mtime it reads is the one
      # the cache's tar preserved: when that dependency was first compiled. A
      # dependency that never changes is compiled once and carried from cache
      # to cache under that date, so a week after the last cold build, any
      # Cargo.lock change deleted all of them and the PR rebuilt ~1,080 crates
      # (12-17 minutes on Windows) instead of the dozen it had changed.
      #
      # Stamping what this run is about to save as fresh means the cutoff only
      # ever removes what no run has used for a week. Safe for cargo: registry
      # sources never change under a fixed version, and rust-cache already
      # leaves the workspace's own crates out of what it saves. Only the top
      # entries of each directory are stamped, because that is what the
      # cutoff reads. Runs after the tests and before rust-cache's post step,
      # which is the one that saves.
      - name: Keep the saved build artifacts inside rust-cache's one-week cutoff
        if: github.event_name == 'push'
        shell: bash
        run: |
          for dir in deps build .fingerprint; do
            path="src-tauri/target/debug/$dir"
            [ -d "$path" ] && find "$path" -mindepth 1 -maxdepth 1 -exec touch {} +
          done
          exit 0
