name: release

# Trigger: pushing an annotated tag like `v0.2.1`, `v0.3.0-rc1`, etc.
# The workflow compiles the Tauri app, signs the updater artifacts with
# the keypair stored in repo secrets, and publishes a *draft* GitHub
# Release with the binaries + `latest.json` attached. The maintainer
# reviews and clicks "Publish" manually.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — output of `pnpm tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — password used when generating the key
#
# See RELEASING.md at the repo root for the one-time setup steps.

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger for first-time signing-key smoke tests, before a real
  # tag is ever published. Provide a synthetic tag name as input — the
  # workflow uses it for both the GitHub release and the bundle version
  # metadata. Re-runs against the same tag will fail (a release with
  # that name already exists), so pick a throwaway like `v0.0.0-test`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Synthetic tag name to use for the draft release"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022, not windows-latest: GitHub migrated
          # windows-latest to Windows Server 2025 + VS2026 in June 2026,
          # which broke WiX v3 bundling here (see this file's git history for
          # the Windows Defender / VBScript fixes that were tried and didn't
          # help). WiX v3 — what tauri-action uses to build the MSI — was
          # archived end-of-life in February 2025 and will never be updated
          # for compatibility with an OS that didn't exist when it was
          # frozen. Rather than chase individual incompatibilities, stay on
          # the last image generation WiX v3 was actually built against.
          - platform: windows-2022
            args: ""
          # Builds the `.deb` + `.AppImage` targets from tauri.conf.json's
          # bundle.targets. Deliberately the OLDEST supported Ubuntu image
          # rather than ubuntu-latest: an AppImage links against the glibc of
          # whatever built it (22.04 is glibc 2.35), so building on a newer
          # image would silently narrow the set of distros the artifact can
          # start on. The apt deps for this leg are installed by the
          # conditional step below, and `fail-fast: false` above means a Linux
          # failure can no longer take the Windows artifacts down with it.
          #
          # MIGRATION DEADLINE: ubuntu-22.04 is GA today but has a published
          # retirement schedule (actions/runner-images#14254) — deprecation
          # begins 2026-09-17 (longer queue times), GitHub runs deliberate
          # brownouts through late March / mid-April 2027 where jobs just fail,
          # and it stops working entirely on 2027-04-17. Move this to
          # ubuntu-24.04 (glibc 2.39) before the brownouts start; the only cost
          # is that the AppImage then requires a distro with glibc >= 2.39.
          - platform: ubuntu-22.04
            args: ""
          # Apple Silicon only (aarch64-apple-darwin, this runner's host), so
          # the sidecar is built once exactly as on the other two legs; a
          # universal binary would need it built twice and joined with `lipo`
          # for Intel Macs nobody has asked for. Pinned rather than
          # macos-latest for the reason the other two legs are: an image change
          # should be a deliberate edit, not something a release discovers.
          #
          # Unsigned unless the Apple secrets below exist: the `.app` carries an
          # ad-hoc signature (`bundle.macOS.signingIdentity: "-"` in
          # tauri.conf.json), which arm64 needs to run at all, but no Developer
          # ID, so Gatekeeper asks once on first open (README → macOS). The
          # updater does not depend on it: it verifies our own minisign
          # signature, the same as on Windows and Linux.
          - platform: macos-15
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Fails in seconds instead of after a full release compile. Without the
      # private key tauri-action signs nothing, and an installed HuginnDB
      # refuses an update it cannot verify, so a release built without it is
      # one no existing install can move to.
      - name: Check the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (setup steps in RELEASING.md)."
            exit 1
          fi

      - name: Install pnpm
        # Version is intentionally not pinned here — pnpm/action-setup
        # reads `packageManager` from package.json. Specifying both
        # produces ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned via package.json `packageManager`) requires
          # Node >= 22.13 — it `require`s the built-in `node:sqlite`, absent
          # before Node 22.5, so Node 20 crashes install with
          # ERR_UNKNOWN_BUILTIN_MODULE. Keep this >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          # Restore only. A cache saved by a tag run is scoped to that tag, so
          # no later run can read it, yet each one took ~2.2 GB of the repo's
          # 10 GB budget and evicted the develop/main caches CI depends on.
          save-if: false

      - uses: ./.github/actions/linux-deps

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Resolve a single source of truth for the tag name. On tag pushes
      # `github.ref_name` already holds the tag; on manual dispatch we
      # take the user-supplied input instead.
      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
          # Mark anything with a hyphen (e.g. v0.3.0-rc1, v0.0.0-test) as
          # a GitHub prerelease so the auto-updater never picks it up via
          # /releases/latest. Stable tags stay non-prerelease.
          if [[ "${{ github.event_name }}" = "workflow_dispatch" || "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Ships inside the installer, next to the main executable; the action
      # explains the placeholder-then-build order it needs.
      - name: Build and stage the huginndb-mcp sidecar
        id: sidecar
        uses: ./.github/actions/sidecar
        with:
          mode: build

      # Signing and notarisation turn on by adding the secrets, with no change
      # to this file: tauri-action reads these variables from the environment.
      # Until then the .dmg ships ad-hoc signed and the run says so. Taken
      # from Muninn's release workflow. Kept right before tauri-action so the
      # setup steps above never see these variables in their environment.
      - name: Apple signing and notarisation (when the secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            echo "::warning::No Apple signing secrets: the .dmg is published ad-hoc signed, without a Developer ID or notarisation."
          fi

      # `retryAttempts` matters now that the matrix has more than one leg.
      # tauri-action does NOT clobber `latest.json` when a second platform
      # publishes to the same release — it fetches the existing asset, merges
      # its own entries into `platforms`, then deletes and re-uploads
      # (src/upload-version-json.ts) — so the Windows entry survives the Linux
      # job and vice versa. What it does have is a race
      # (tauri-apps/tauri-action#1270): two jobs finishing close together can
      # both resolve the same asset id, and whichever deletes second 404s. The
      # action deliberately retries the whole fetch-merge-upload operation
      # rather than just the upload (a narrower retry could re-upload a stale
      # latest.json), so raising the attempt count is the intended mitigation.
      # If intermittent 404s still show up, serialise with `max-parallel: 1`
      # or move latest.json generation into a final `needs:`-gated job.
      #
      # Pinned to a commit (action-v0.6.2, what `@v0` resolved to) rather than
      # the moving `v0` tag: this step receives the updater's private signing
      # key, and a tag can be re-pointed at different code without any change
      # to this file. Bumping it is a deliberate edit of the SHA.
      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.resolve_tag.outputs.tag }}
          releaseName: "HuginnDB ${{ steps.resolve_tag.outputs.tag }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/lopezz-dev/huginnDB/blob/main/CHANGELOG.md) for the full list of changes.

            Installed builds with auto-update support will detect this release on next launch and offer to install it from inside the app.
          releaseDraft: true
          prerelease: ${{ steps.resolve_tag.outputs.prerelease }}
          retryAttempts: 3
          args: ${{ matrix.args }}

      # Packages the sidecar built above a second way: as an MCP Bundle
      # (`.mcpb`), the one-click install format Claude Desktop and other
      # MCPB-aware clients read. Same binary, different wrapper — the installer
      # asset above puts it next to the app for clients configured by path,
      # this one is for clients that install extensions.
      #
      # One bundle per platform rather than one carrying all of them: the
      # payload is a precompiled binary, and a fat bundle would trip the size
      # of every install to serve one architecture.
      #
      # Runs AFTER tauri-action because that step is what creates the draft
      # release this uploads into. `--clobber` so a re-run of a leg replaces
      # its own asset instead of failing on the name.
      - name: Package and upload the .mcpb bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/build-mcpb.sh "${{ steps.sidecar.outputs.binary }}" "${{ steps.sidecar.outputs.platform }}"
          gh release upload "${{ steps.resolve_tag.outputs.tag }}" \
            mcpb/build/*.mcpb --clobber
